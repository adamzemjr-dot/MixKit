<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MixKit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>MixKit</h1>
    <p>Your portable smoothie starter box</p>
  </header>

  <main class="container">

    <section>
      <h2>What’s Inside the MixKit</h2>

      <div class="grid">
        <div class="card">
          <img src="https://images.unsplash.com/photo-1615485291234-9d6942184a64" alt="Portable blender">
          <h3>Portable Blender</h3>
          <p>Blend anywhere, anytime.</p>
        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1505253216365-2ed7b417d29a" alt="Fruit smoothie">
          <h3>Fresh Smoothies</h3>
          <p>Made with real fruit.</p>
        </div>

        <div class="card">
          <img src="https://images.unsplash.com/photo-1570197571499-166b36435e9f" alt="Healthy smoothie">
          <h3>Healthy Ingredients</h3>
          <p>Fuel your day the right way.</p>
        </div>
      </div>
    </section>

    <section class="tech">
      <h2>Smart Power</h2>
      <p>Inspired by futuristic tech.</p>
      <img src="images/ironman-ui.png" alt="Tech inspiration">
    </section>

    <button id="cta-btn">Coming Soon</button>

  </main>

  <script src="script.js"></script>
</body>
</html>
