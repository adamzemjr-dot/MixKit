<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MixKit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <h1>MixKit</h1>
    <p>Your portable smoothie starter box</p>
  </header>

  <section class="image-section">
    <h2>What’s Inside the MixKit</h2>

    <div class="image-grid">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1615485291234-9d6942184a64" alt="Portable blender">
        <p>Portable Blender</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1505253216365-2ed7b417d29a" alt="Fruit smoothie">
        <p>Fresh Smoothies</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1570197571499-166b36435e9f" alt="Berry smoothie">
        <p>Healthy Ingredients</p>
      </div>
    </div>
  </section>

  <!-- NEW FEATURE SECTION -->
  <section class="tech-section">
    <h2>Smart Power. Smart Fuel.</h2>
    <p>Inspired by next-gen tech to fuel your body anywhere.</p>

    <img
      src="images/ironman-ui.png"
      alt="Futuristic tech interface inspiration"
      class="tech-image"
    >
  </section>

  <button id="cta-btn">Order Your MixKit</button>

  <script src="script.js"></script>
</body>
</html>
